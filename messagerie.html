<!DOCTYPE html>
<html lang="fr">
<head>
<title>Messagerie — Sakina</title>
<meta name="description" content="Échangez avec les membres de Sakina dans un cadre respectueux.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123832">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23123832'/><g fill='none' stroke='%23B8925A' stroke-width='1.3'><rect x='6.2' y='6.2' width='11.6' height='11.6'/><rect x='6.2' y='6.2' width='11.6' height='11.6' transform='rotate(45 12 12)'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sakina.css">
<script>document.documentElement.dataset.auth=(function(){try{return localStorage.getItem('sakina_user')?'member':'guest';}catch(e){return 'guest';}})();</script>
</head>
<body class="thread-page">
  <header class="thread-head">
    <div class="shell">
      <a class="thread-back" href="/profils.html" aria-label="Retour aux profils">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
      </a>
      <div class="thread-peer">
        <div class="who" id="threadTitle">Conversation</div>
        <div class="sub">Échange en vue du mariage</div>
      </div>
    </div>
  </header>

  <div id="authNotice" class="notice" style="display:none; margin:28px 20px;">
    Vous devez d'abord <a href="/connexion.html">vous connecter</a>.
  </div>

  <div class="thread" id="thread" style="display:none;" aria-live="polite"></div>

  <div class="thread-compose" id="composeWrap" style="display:none;">
    <form id="messageForm">
      <label class="visually-hidden" for="content">Votre message</label>
      <input type="text" id="content" placeholder="Écrire un message…" required autocomplete="off" maxlength="1000">
      <button type="submit" class="btn btn-primary" id="sendBtn">Envoyer</button>
    </form>
  </div>

<script src="/assets/sakina.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var toId = params.get('to');
  var toName = params.get('name') || 'ce membre';
  document.getElementById('threadTitle').textContent = 'Conversation avec ' + toName;

  var user = Sakina.currentUser();
  var authNotice = document.getElementById('authNotice');
  var threadEl = document.getElementById('thread');
  var composeWrap = document.getElementById('composeWrap');
  var form = document.getElementById('messageForm');
  var contentInput = document.getElementById('content');
  var sendBtn = document.getElementById('sendBtn');

  if (!user || !toId) {
    authNotice.style.display = 'block';
    if (!toId) {
      authNotice.textContent = "Choisissez d'abord un profil à contacter.";
    }
  } else {
    threadEl.style.display = 'flex';
    composeWrap.style.display = 'block';
    threadEl.innerHTML =
      '<div class="bubble theirs skeleton" style="width:56%;height:38px;" aria-hidden="true"></div>' +
      '<div class="bubble mine skeleton" style="width:42%;height:38px;" aria-hidden="true"></div>' +
      '<div class="bubble theirs skeleton" style="width:64%;height:38px;" aria-hidden="true"></div>';
    loadMessages();
  }

  function emptyThread() {
    return '<div class="empty" style="margin:auto; border:none; background:transparent;">' +
      Sakina.icon('mail', 44).replace('<svg', '<svg class="empty-mark"') +
      '<h3>La conversation commence ici</h3>' +
      '<p>Un premier mot sobre et sincère vaut mieux qu’un long message.</p></div>';
  }

  async function loadMessages() {
    try {
      const res = await fetch('/api/get-messages?userId=' + user.id + '&withId=' + toId);
      const data = await res.json();
      var messages = data.messages || [];

      if (messages.length === 0) {
        threadEl.innerHTML = emptyThread();
        return;
      }

      threadEl.innerHTML = messages.map(function (m) {
        var mine = String(m.sender_id) === String(user.id);
        return '<div class="bubble ' + (mine ? 'mine' : 'theirs') + '">' +
          Sakina.escapeHtml(m.content) + '</div>';
      }).join('');
      threadEl.scrollTop = threadEl.scrollHeight;
    } catch (err) {
      threadEl.innerHTML = '<div class="empty" style="margin:auto; border:none; background:transparent;">' +
        Sakina.icon('alert', 44).replace('<svg', '<svg class="empty-mark"') +
        '<p>Impossible de charger la conversation.</p></div>';
    }
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var content = contentInput.value.trim();
    if (!content) return;

    sendBtn.disabled = true;
    sendBtn.textContent = 'Envoi…';

    try {
      const res = await fetch('/api/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senderId: user.id, recipientId: toId, content: content }),
      });
      if (res.ok) {
        contentInput.value = '';
        await loadMessages();
      } else {
        Sakina.toast("Le message n'a pas pu être envoyé.", 'error');
      }
    } catch (err) {
      Sakina.toast('Impossible de contacter le serveur.', 'error');
    }

    sendBtn.disabled = false;
    sendBtn.textContent = 'Envoyer';
    contentInput.focus();
  });
</script>
</body>
</html>
