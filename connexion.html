<!DOCTYPE html>
<html lang="fr">
<head>
<title>Se connecter — Sakina</title>
<meta name="description" content="Connectez-vous à Sakina pour retrouver vos intentions et vos échanges.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123832">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23123832'/><g fill='none' stroke='%23B8925A' stroke-width='1.3'><rect x='6.2' y='6.2' width='11.6' height='11.6'/><rect x='6.2' y='6.2' width='11.6' height='11.6' transform='rotate(45 12 12)'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sakina.css">
<script>document.documentElement.dataset.auth=(function(){try{return localStorage.getItem('sakina_user')?'member':'guest';}catch(e){return 'guest';}})();</script>
</head>
<body class="canvas-center">
  <main class="canvas-main">
    <div class="auth-card rise">
      <div class="auth-head">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="5.6" y="5.6" width="12.8" height="12.8"/><rect x="5.6" y="5.6" width="12.8" height="12.8" transform="rotate(45 12 12)"/></svg>
          <span class="brand-name">Sakina</span>
        </a>
        <div class="eyebrow is-centered">Bon retour</div>
        <h1>Se connecter</h1>
        <p>Retrouvez votre recherche là où vous l'avez laissée.</p>
      </div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="vous@exemple.com">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Se connecter</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>

      <div class="auth-foot">
        <a href="/inscription.html" class="primary-link">Pas encore de compte ? Créer un compte</a>
        <a href="/" class="quiet-link">← Retour à l'accueil</a>
      </div>
    </div>
  </main>

<script src="/assets/sakina.js"></script>
<script>
  var form = document.getElementById('loginForm');
  var msg = document.getElementById('msg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }

    msg.className = 'msg';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Connexion en cours…';

    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = data.error || "Une erreur s'est produite.";
      } else {
        localStorage.setItem('sakina_user', JSON.stringify(data.user));
        msg.className = 'msg success';
        msg.textContent = 'Connexion réussie ! Redirection…';
        form.reset();
        setTimeout(function () { window.location.href = '/profils.html'; }, 1200);
        return;
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = 'Impossible de contacter le serveur. Réessayez.';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Se connecter';
  });
</script>
</body>
</html>
