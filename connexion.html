<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Se connecter — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--teal-900); color:var(--ink-900);
    font-family:'Work Sans', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--sand-50); border-radius:6px; padding:44px 36px;
    max-width:420px; width:100%; box-shadow:0 30px 60px -30px rgba(0,0,0,0.5);
  }
  .eyebrow{font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-500); font-weight:600; margin-bottom:10px;}
  h1{font-family:'Fraunces', serif; font-size:1.7rem; color:var(--teal-900); font-weight:500;}
  p.sub{margin-top:10px; color:var(--ink-600); font-size:0.92rem;}
  form{margin-top:28px; display:flex; flex-direction:column; gap:16px;}
  label{font-size:0.85rem; font-weight:500; color:var(--ink-900); display:block; margin-bottom:6px;}
  input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:3px;
    font-family:'Work Sans', sans-serif; font-size:0.95rem; background:#fff;
  }
  input:focus{outline:2px solid var(--gold-500); outline-offset:1px; border-color:var(--gold-500);}
  button{
    margin-top:8px; padding:13px; border:none; border-radius:3px;
    background:var(--teal-700); color:var(--sand-50); font-weight:500; font-size:0.95rem;
    cursor:pointer; transition:background .2s;
  }
  button:hover{background:var(--teal-900);}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .msg{margin-top:16px; padding:12px 14px; border-radius:3px; font-size:0.88rem; display:none;}
  .msg.error{background:#FBE8E4; color:#8A2E1E; display:block;}
  .msg.success{background:#E4EFE9; color:#1B4D3E; display:block;}
  .back{display:block; margin-top:22px; text-align:center; font-size:0.85rem; color:var(--ink-600); text-decoration:none;}
  .switch{display:block; margin-top:8px; text-align:center; font-size:0.85rem; color:var(--teal-700); text-decoration:none; font-weight:500;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Sakina</div>
    <h1>Se connecter</h1>
    <p class="sub">Retrouvez votre recherche là où vous l'avez laissée.</p>

    <form id="loginForm">
      <div>
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn">Se connecter</button>
      <div class="msg" id="msg"></div>
    </form>
    <a href="/inscription.html" class="switch">Pas encore de compte ? Créer un compte</a>
    <a href="/" class="back">← Retour à l'accueil</a>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Connexion en cours…';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = data.error || "Une erreur s'est produite.";
      } else {
        localStorage.setItem('sakina_user', JSON.stringify(data.user));
        msg.className = 'msg success';
        msg.textContent = 'Connexion réussie ! Redirection…';
        form.reset();
        setTimeout(() => { window.location.href = '/profils.html'; }, 1200);
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = "Impossible de contacter le serveur. Réessayez.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Se connecter';
    }
  });
</script>
</body>
</html>
