<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcourir les profils — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--sand-50); color:var(--ink-900); font-family:'Work Sans', sans-serif; padding:24px 16px 60px;}
  .wrap{max-width:640px; margin:0 auto;}
  h1{font-family:'Fraunces', serif; font-size:1.6rem; color:var(--teal-900); margin-bottom:6px;}
  p.sub{color:var(--ink-600); font-size:0.9rem; margin-bottom:24px;}
  .back{display:inline-block; margin-bottom:20px; font-size:0.85rem; color:var(--ink-600); text-decoration:none;}
  .grid{display:flex; flex-direction:column; gap:14px;}
  .profile-card{
    background:var(--sand-100); border:1px solid var(--line); border-radius:5px; padding:18px 20px;
  }
  .profile-card .name{font-family:'Fraunces', serif; font-size:1.15rem; color:var(--teal-900);}
  .profile-card .meta{font-size:0.85rem; color:var(--ink-600); margin-top:3px;}
  .profile-card .bio{font-size:0.9rem; margin-top:10px; color:var(--ink-900);}
  .tag{display:inline-block; font-size:0.72rem; padding:3px 9px; border:1px solid var(--line); border-radius:20px; color:var(--ink-600); margin-top:8px;}
  .empty{color:var(--ink-600); font-size:0.92rem; text-align:center; padding:40px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back">← Retour à l'accueil</a>
    <h1>Profils</h1>
    <p class="sub">Découvrez les membres inscrits sur Sakina.</p>
    <div class="grid" id="grid">
      <div class="empty">Chargement…</div>
    </div>
  </div>

<script>
  const grid = document.getElementById('grid');
  const practiceLabels = {
    'pratiquant': 'Pratiquant·e',
    'peu-pratiquant': 'Peu pratiquant·e',
    'en-cheminement': 'En cheminement',
  };

  fetch('/api/list-profiles')
    .then(res => res.json())
    .then(data => {
      const profiles = data.profiles || [];
      if (profiles.length === 0) {
        grid.innerHTML = '<div class="empty">Aucun profil pour le moment. Soyez le premier !</div>';
        return;
      }
      grid.innerHTML = profiles.map(p => `
        <div class="profile-card">
          <div class="name">${escapeHtml(p.first_name)}, ${p.age} ans</div>
          <div class="meta">${escapeHtml(p.city)}</div>
          ${p.practice ? `<span class="tag">${practiceLabels[p.practice] || escapeHtml(p.practice)}</span>` : ''}
          ${p.bio ? `<div class="bio">${escapeHtml(p.bio)}</div>` : ''}
        </div>
      `).join('');
    })
    .catch(() => {
      grid.innerHTML = '<div class="empty">Impossible de charger les profils pour le moment.</div>';
    });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
