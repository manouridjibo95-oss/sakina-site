<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--teal-900); color:var(--ink-900);
    font-family:'Work Sans', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    background:var(--sand-50); border-radius:6px; padding:40px 32px;
    max-width:460px; width:100%; box-shadow:0 30px 60px -30px rgba(0,0,0,0.5);
  }
  .eyebrow{font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-500); font-weight:600; margin-bottom:10px;}
  h1{font-family:'Fraunces', serif; font-size:1.6rem; color:var(--teal-900); font-weight:500;}
  p.sub{margin-top:10px; color:var(--ink-600); font-size:0.9rem;}
  form{margin-top:24px; display:flex; flex-direction:column; gap:14px;}
  label{font-size:0.85rem; font-weight:500; color:var(--ink-900); display:block; margin-bottom:5px;}
  input, select, textarea{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:3px;
    font-family:'Work Sans', sans-serif; font-size:0.92rem; background:#fff;
  }
  textarea{resize:vertical; min-height:80px;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--gold-500); outline-offset:1px; border-color:var(--gold-500);}
  .row{display:flex; gap:12px;}
  .row > div{flex:1;}
  button{
    margin-top:6px; padding:13px; border:none; border-radius:3px;
    background:var(--teal-700); color:var(--sand-50); font-weight:500; font-size:0.95rem;
    cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .msg{margin-top:14px; padding:11px 13px; border-radius:3px; font-size:0.85rem; display:none;}
  .msg.error{background:#FBE8E4; color:#8A2E1E; display:block;}
  .msg.success{background:#E4EFE9; color:#1B4D3E; display:block;}
  .back{display:block; margin-top:20px; text-align:center; font-size:0.85rem; color:var(--ink-600); text-decoration:none;}
  .signin-notice{background:#FBE8E4; color:#8A2E1E; padding:14px; border-radius:3px; font-size:0.9rem; margin-top:20px;}
  .signin-notice a{color:#8A2E1E; font-weight:600;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Sakina</div>
    <h1>Compléter mon profil</h1>
    <p class="sub">Ces informations seront visibles par les autres membres.</p>

    <div id="authNotice" class="signin-notice" style="display:none;">
      Vous devez d'abord <a href="/connexion.html">vous connecter</a> ou <a href="/inscription.html">créer un compte</a>.
    </div>

    <form id="profileForm" style="display:none;">
      <div>
        <label for="firstName">Prénom</label>
        <input type="text" id="firstName" required>
      </div>
      <div class="row">
        <div>
          <label for="age">Âge</label>
          <input type="number" id="age" min="18" max="90" required>
        </div>
        <div>
          <label for="gender">Genre</label>
          <select id="gender" required>
            <option value="">Choisir</option>
            <option value="homme">Homme</option>
            <option value="femme">Femme</option>
          </select>
        </div>
      </div>
      <div>
        <label for="city">Ville</label>
        <input type="text" id="city" required>
      </div>
      <div>
        <label for="practice">Pratique religieuse (facultatif)</label>
        <select id="practice">
          <option value="">Préférer ne pas préciser</option>
          <option value="pratiquant">Pratiquant·e</option>
          <option value="peu-pratiquant">Peu pratiquant·e</option>
          <option value="en-cheminement">En cheminement</option>
        </select>
      </div>
      <div>
        <label for="bio">À propos de moi</label>
        <textarea id="bio" placeholder="Quelques mots sur vous, vos valeurs, votre projet de vie…"></textarea>
      </div>
      <button type="submit" id="submitBtn">Enregistrer mon profil</button>
      <div class="msg" id="msg"></div>
    </form>

    <a href="/" class="back">← Retour à l'accueil</a>
  </div>

<script>
  const userJson = localStorage.getItem('sakina_user');
  const authNotice = document.getElementById('authNotice');
  const form = document.getElementById('profileForm');

  if (!userJson) {
    authNotice.style.display = 'block';
  } else {
    form.style.display = 'flex';
  }

  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement…';

    const user = JSON.parse(userJson);

    try {
      const res = await fetch('/api/create-profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: user.id,
          firstName: document.getElementById('firstName').value,
          age: parseInt(document.getElementById('age').value, 10),
          city: document.getElementById('city').value,
          gender: document.getElementById('gender').value,
          practice: document.getElementById('practice').value,
          bio: document.getElementById('bio').value,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = data.error || "Une erreur s'est produite.";
      } else {
        msg.className = 'msg success';
        msg.textContent = 'Profil enregistré !';
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = "Impossible de contacter le serveur. Réessayez.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer mon profil';
    }
  });
</script>
</body>
                                                           </html>
