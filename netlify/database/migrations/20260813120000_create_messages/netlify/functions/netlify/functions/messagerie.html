<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--sand-50); color:var(--ink-900); font-family:'Work Sans', sans-serif; min-height:100vh; display:flex; flex-direction:column;}
  header{background:var(--teal-900); color:var(--sand-50); padding:16px 20px;}
  header .back{color:#B9CBC3; text-decoration:none; font-size:0.82rem;}
  header h1{font-family:'Fraunces', serif; font-size:1.2rem; margin-top:4px;}
  .thread{flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:10px;}
  .bubble{max-width:75%; padding:10px 14px; border-radius:10px; font-size:0.92rem; line-height:1.4;}
  .bubble.mine{align-self:flex-end; background:var(--teal-700); color:var(--sand-50); border-bottom-right-radius:2px;}
  .bubble.theirs{align-self:flex-start; background:var(--sand-100); border:1px solid var(--line); border-bottom-left-radius:2px;}
  .empty{color:var(--ink-600); text-align:center; padding:40px 0; font-size:0.9rem;}
  form{display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); background:var(--sand-50);}
  input{flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:20px; font-family:'Work Sans', sans-serif; font-size:0.92rem;}
  input:focus{outline:2px solid var(--gold-500); outline-offset:1px; border-color:var(--gold-500);}
  button{padding:0 20px; border:none; border-radius:20px; background:var(--teal-700); color:var(--sand-50); font-weight:500; font-size:0.9rem; cursor:pointer;}
  button:disabled{opacity:0.6;}
  .signin-notice{margin:30px 20px; background:#FBE8E4; color:#8A2E1E; padding:14px; border-radius:3px; font-size:0.9rem;}
  .signin-notice a{color:#8A2E1E; font-weight:600;}
</style>
</head>
<body>
  <header>
    <a href="/profils.html" class="back">← Profils</a>
    <h1 id="threadTitle">Conversation</h1>
  </header>

  <div id="authNotice" class="signin-notice" style="display:none;">
    Vous devez d'abord <a href="/connexion.html">vous connecter</a>.
  </div>

  <div class="thread" id="thread" style="display:none;">
    <div class="empty">Chargement…</div>
  </div>

  <form id="messageForm" style="display:none;">
    <input type="text" id="content" placeholder="Écrire un message…" required autocomplete="off">
    <button type="submit" id="sendBtn">Envoyer</button>
  </form>

<script>
  const params = new URLSearchParams(window.location.search);
  const toId = params.get('to');
  const toName = params.get('name') || 'ce membre';
  document.getElementById('threadTitle').textContent = 'Conversation avec ' + toName;

  const userJson = localStorage.getItem('sakina_user');
  const authNotice = document.getElementById('authNotice');
  const threadEl = document.getElementById('thread');
  const form = document.getElementById('messageForm');
  const contentInput = document.getElementById('content');
  const sendBtn = document.getElementById('sendBtn');

  if (!userJson || !toId) {
    authNotice.style.display = 'block';
    authNotice.textContent = !toId
      ? "Choisissez d'abord un profil à contacter."
      : authNotice.textContent;
  } else {
    threadEl.style.display = 'flex';
    form.style.display = 'flex';
    loadMessages();
  }

  const user = userJson ? JSON.parse(userJson) : null;

  async function loadMessages() {
    try {
      const res = await fetch(`/api/get-messages?userId=${user.id}&withId=${toId}`);
      const data = await res.json();
      const messages = data.messages || [];
      if (messages.length === 0) {
        threadEl.innerHTML = '<div class="empty">Aucun message pour le moment. Dites bonjour !</div>';
        return;
      }
      threadEl.innerHTML = messages.map(m => `
        <div class="bubble ${m.sender_id == user.id ? 'mine' : 'theirs'}">${escapeHtml(m.content)}</div>
      `).join('');
      threadEl.scrollTop = threadEl.scrollHeight;
    } catch (err) {
      threadEl.innerHTML = '<div class="empty">Impossible de charger la conversation.</div>';
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const content = contentInput.value.trim();
    if (!content) return;
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/send-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senderId: user.id, recipientId: toId, content }),
      });
      if (res.ok) {
        contentInput.value = '';
        await loadMessages();
      }
    } catch (err) {
      // silent fail, user can retry
    } finally {
      sendBtn.disabled = false;
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
