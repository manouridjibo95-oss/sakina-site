<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--sand-50); color:var(--ink-900); font-family:'Work Sans', sans-serif; padding:24px 16px 60px;}
  .wrap{max-width:520px; margin:0 auto;}
  .back{display:inline-block; margin-bottom:20px; font-size:0.85rem; color:var(--ink-600); text-decoration:none;}
  .card{background:var(--sand-100); border:1px solid var(--line); border-radius:6px; padding:28px; text-align:center;}
  .photo{width:120px; height:120px; border-radius:50%; object-fit:cover; margin:0 auto; border:2px solid var(--sand-50); display:block;}
  .photo-placeholder{
    width:120px; height:120px; border-radius:50%; margin:0 auto;
    background:var(--line); display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:2.4rem; color:var(--ink-600);
  }
  .name{font-family:'Fraunces', serif; font-size:1.5rem; color:var(--teal-900); margin-top:18px;}
  .meta{font-size:0.9rem; color:var(--ink-600); margin-top:4px;}
  .tags{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:12px;}
  .tag{font-size:0.75rem; padding:4px 12px; border:1px solid var(--line); border-radius:20px; color:var(--ink-600);}
  .bio{margin-top:20px; font-size:0.95rem; line-height:1.6; color:var(--ink-900); text-align:left;}
  .actions{display:flex; gap:10px; margin-top:26px;}
  .btn{flex:1; padding:12px; border-radius:3px; font-size:0.9rem; font-weight:500; text-decoration:none; text-align:center; border:none; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--teal-700); color:var(--sand-50);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink-900);}
  .empty{color:var(--ink-600); text-align:center; padding:60px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <a href="/profils.html" class="back">← Profils</a>
    <div id="content" class="card">
      <div class="empty">Chargement…</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('id');
  const content = document.getElementById('content');
  const practiceLabels = {
    'pratiquant': 'Pratiquant·e',
    'peu-pratiquant': 'Peu pratiquant·e',
    'en-cheminement': 'En cheminement',
  };

  if (!profileId) {
    content.innerHTML = '<div class="empty">Profil introuvable.</div>';
  } else {
    fetch(`/api/get-profile?userId=${profileId}`)
      .then(res => res.json())
      .then(data => {
        const p = data.profile;
        if (!p) {
          content.innerHTML = '<div class="empty">Ce membre n\'a pas encore de profil complet.</div>';
          return;
        }
        content.innerHTML = `
          ${p.photo_data
            ? `<img class="photo" src="${p.photo_data}" alt="${escapeHtml(p.first_name)}">`
            : `<div class="photo-placeholder">${escapeHtml(p.first_name.charAt(0).toUpperCase())}</div>`}
          <div class="name">${escapeHtml(p.first_name)}, ${p.age} ans</div>
          <div class="meta">${escapeHtml(p.city)}</div>
          <div class="tags">
            ${p.practice ? `<span class="tag">${practiceLabels[p.practice] || escapeHtml(p.practice)}</span>` : ''}
            ${p.wali_name ? `<span class="tag">Wali ajouté</span>` : ''}
          </div>
          ${p.bio ? `<div class="bio">${escapeHtml(p.bio)}</div>` : ''}
          <div class="actions">
            <button class="btn btn-primary" onclick="sendIntention(${profileId})">Envoyer une intention</button>
            <a class="btn btn-ghost" href="/messagerie.html?to=${profileId}&name=${encodeURIComponent(p.first_name)}">Contacter</a>
          </div>
        `;

        const viewerJson = localStorage.getItem('sakina_user');
        const viewerId = viewerJson ? JSON.parse(viewerJson).id : null;
        fetch('/api/record-view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ viewedUserId: profileId, viewerId }),
        }).catch(() => {});
      })
      .catch(() => {
        content.innerHTML = '<div class="empty">Impossible de charger ce profil.</div>';
      });
  }

  async function sendIntention(recipientId) {
    const userJson = localStorage.getItem('sakina_user');
    if (!userJson) {
      alert('Connectez-vous pour envoyer une intention.');
      return;
    }
    const user = JSON.parse(userJson);
    try {
      const res = await fetch('/api/send-intention', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senderId: user.id, recipientId }),
      });
      const data = await res.json();
      alert(res.ok ? 'Intention envoyée !' : (data.error || 'Erreur'));
    } catch (err) {
      alert("Impossible d'envoyer l'intention.");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
