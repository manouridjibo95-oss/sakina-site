<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Sakina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#123832; --teal-700:#1B4D3E;
    --sand-100:#F4EEE1; --sand-50:#FAF6ED;
    --gold-500:#B8925A; --gold-300:#D9BD8E; --ink-900:#2B2621; --ink-600:#5A5248; --line:#DFD5BE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--sand-100); color:var(--ink-900); font-family:'Work Sans', sans-serif; min-height:100vh;}

  .topbar{background:var(--teal-900); padding:20px 16px;}
  .topbar-inner{max-width:520px; margin:0 auto;}
  .back{display:inline-flex; align-items:center; gap:6px; font-size:0.82rem; color:#B9CBC3; text-decoration:none;}

  .wrap{max-width:520px; margin:0 auto; padding:32px 16px 60px;}
  .card{
    background:var(--sand-50); border-radius:10px; padding:0; text-align:center; overflow:hidden;
    box-shadow:0 12px 32px -12px rgba(18,56,50,0.25);
  }
  .cover{height:90px; background:linear-gradient(135deg, var(--teal-700), var(--teal-900));}
  .photo-wrap{margin-top:-52px; position:relative; z-index:2;}
  .photo{width:104px; height:104px; border-radius:50%; object-fit:cover; margin:0 auto; border:4px solid var(--sand-50); display:block;}
  .photo-placeholder{
    width:104px; height:104px; border-radius:50%; margin:0 auto; border:4px solid var(--sand-50);
    background:linear-gradient(135deg, var(--gold-300), var(--gold-500));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-size:2.2rem; color:var(--sand-50); font-weight:500;
  }
  .content{padding:16px 28px 32px;}
  .name{font-family:'Fraunces', serif; font-size:1.6rem; color:var(--teal-900); margin-top:8px;}
  .meta{font-size:0.92rem; color:var(--ink-600); margin-top:4px; display:flex; align-items:center; justify-content:center; gap:5px;}
  .tags{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-top:16px;}
  .tag{font-size:0.75rem; padding:5px 13px; border:1px solid var(--line); border-radius:20px; color:var(--ink-600); background:var(--sand-100);}
  .tag.wali{color:var(--teal-700); border-color:var(--teal-700); background:#E4EFE9; font-weight:500;}
  .bio{margin-top:22px; padding-top:20px; border-top:1px solid var(--line); font-size:0.96rem; line-height:1.7; color:var(--ink-900); text-align:left;}
  .actions{display:flex; gap:10px; margin-top:26px;}
  .btn{flex:1; padding:13px; border-radius:20px; font-size:0.9rem; font-weight:500; text-decoration:none; text-align:center; border:none; cursor:pointer; font-family:inherit; transition:all .2s;}
  .btn-primary{background:var(--teal-700); color:var(--sand-50);}
  .btn-primary:hover{background:var(--teal-900);}
  .btn-outline{background:transparent; border:1px solid var(--teal-700); color:var(--teal-700);}
  .btn-outline:hover{background:var(--teal-700); color:var(--sand-50);}
  .empty{color:var(--ink-600); text-align:center; padding:60px 20px;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a href="/profils.html" class="back">← Profils</a>
    </div>
  </div>
  <div class="wrap">
    <div id="content" class="card">
      <div class="empty">Chargement…</div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const profileId = params.get('id');
  const content = document.getElementById('content');
  const practiceLabels = {
    'pratiquant': 'Pratiquant·e',
    'peu-pratiquant': 'Peu pratiquant·e',
    'en-cheminement': 'En cheminement',
  };

  if (!profileId) {
    content.innerHTML = '<div class="empty">Profil introuvable.</div>';
  } else {
    fetch(`/api/get-profile?userId=${profileId}`)
      .then(res => res.json())
      .then(data => {
        const p = data.profile;
        if (!p) {
          content.innerHTML = '<div class="empty">Ce membre n\'a pas encore de profil complet.</div>';
          return;
        }
        content.innerHTML = `
          <div class="cover"></div>
          <div class="photo-wrap">
            ${p.photo_data
              ? `<img class="photo" src="${p.photo_data}" alt="${escapeHtml(p.first_name)}">`
              : `<div class="photo-placeholder">${escapeHtml(p.first_name.charAt(0).toUpperCase())}</div>`}
          </div>
          <div class="content">
            <div class="name">${escapeHtml(p.first_name)}, ${p.age} ans</div>
            <div class="meta">📍 ${escapeHtml(p.city)}</div>
            <div class="tags">
              ${p.practice ? `<span class="tag">${practiceLabels[p.practice] || escapeHtml(p.practice)}</span>` : ''}
              ${p.wali_name ? `<span class="tag wali">✓ Wali ajouté</span>` : ''}
            </div>
            ${p.bio ? `<div class="bio">${escapeHtml(p.bio)}</div>` : ''}
            <div class="actions">
              <button class="btn btn-primary" onclick="sendIntention(${profileId})">Envoyer une intention</button>
              <a class="btn btn-outline" href="/messagerie.html?to=${profileId}&name=${encodeURIComponent(p.first_name)}">Contacter</a>
            </div>
          </div>
        `;

        const viewerJson = localStorage.getItem('sakina_user');
        const viewerId = viewerJson ? JSON.parse(viewerJson).id : null;
        fetch('/api/record-view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ viewedUserId: profileId, viewerId }),
        }).catch(() => {});
      })
      .catch(() => {
        content.innerHTML = '<div class="empty">Impossible de charger ce profil.</div>';
      });
  }

  async function sendIntention(recipientId) {
    const userJson = localStorage.getItem('sakina_user');
    if (!userJson) {
      alert('Connectez-vous pour envoyer une intention.');
      return;
    }
    const user = JSON.parse(userJson);
    try {
      const res = await fetch('/api/send-intention', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senderId: user.id, recipientId }),
      });
      const data = await res.json();
      alert(res.ok ? 'Intention envoyée !' : (data.error || 'Erreur'));
    } catch (err) {
      alert("Impossible d'envoyer l'intention.");
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
