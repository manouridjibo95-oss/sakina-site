<!DOCTYPE html>
<html lang="fr">
<head>
<title>Créer mon compte — Sakina</title>
<meta name="description" content="Créez votre compte Sakina gratuitement et commencez votre recherche en vue du mariage.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123832">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='4' fill='%23123832'/><g fill='none' stroke='%23B8925A' stroke-width='1.3'><rect x='6.2' y='6.2' width='11.6' height='11.6'/><rect x='6.2' y='6.2' width='11.6' height='11.6' transform='rotate(45 12 12)'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/sakina.css">
<script>document.documentElement.dataset.auth=(function(){try{return localStorage.getItem('sakina_user')?'member':'guest';}catch(e){return 'guest';}})();</script>
</head>
<body class="canvas-center">
  <main class="canvas-main">
    <div class="auth-card rise">
      <div class="auth-head">
        <a class="brand" href="/">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="5.6" y="5.6" width="12.8" height="12.8"/><rect x="5.6" y="5.6" width="12.8" height="12.8" transform="rotate(45 12 12)"/></svg>
          <span class="brand-name">Sakina</span>
        </a>
        <div class="eyebrow is-centered">Rejoindre</div>
        <h1>Créer mon compte</h1>
        <p>Quelques informations pour commencer votre recherche en toute sérénité.</p>
      </div>

      <form id="signupForm" class="auth-form" novalidate>
        <div class="field">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="vous@exemple.com">
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
          <div class="hint">8 caractères minimum.</div>
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Créer mon compte</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>

      <div class="auth-foot">
        <a href="/connexion.html" class="primary-link">Déjà un compte ? Se connecter</a>
        <a href="/" class="quiet-link">← Retour à l'accueil</a>
      </div>
    </div>
  </main>

<script src="/assets/sakina.js"></script>
<script>
  var form = document.getElementById('signupForm');
  var msg = document.getElementById('msg');
  var submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }

    msg.className = 'msg';
    msg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Création en cours…';

    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
      });
      const data = await res.json();

      if (!res.ok) {
        msg.className = 'msg error';
        msg.textContent = data.error || "Une erreur s'est produite.";
      } else {
        localStorage.setItem('sakina_user', JSON.stringify(data.user));
        msg.className = 'msg success';
        msg.textContent = 'Compte créé ! Redirection vers votre profil…';
        form.reset();
        setTimeout(function () { window.location.href = '/profil.html'; }, 1200);
        return;
      }
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = 'Impossible de contacter le serveur. Réessayez.';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Créer mon compte';
  });
</script>
</body>
</html>
